name: Backend Continuous Integration

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "starter/backend/**"


jobs:

  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Cache pipenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('starter/backend/Pipfile.lock') }}


      - name: Install pipenv
        run: pip install pipenv


      - name: Install dependencies
        run: pipenv install --dev


      - name: Run lint
        run: pipenv run lint



  test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Cache pipenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('starter/backend/Pipfile.lock') }}


      - name: Install pipenv
        run: pip install pipenv


      - name: Install dependencies
        run: pipenv install --dev


      - name: Run tests
        run: pipenv run test



  build:
    name: Backend Docker Build
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    defaults:
      run:
        working-directory: starter/backend

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Build Docker image
        run: docker build --tag mp-backend:latest .
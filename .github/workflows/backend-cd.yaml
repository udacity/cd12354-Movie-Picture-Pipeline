name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.6"
          cache: pipenv
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv install --dev

      - name: Run lint
        run: pipenv run lint


  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.6"
          cache: pipenv
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv install --dev

      - name: Run tests
        run: pipenv run test


  build-and-deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build backend Docker image
        working-directory: starter/backend
        run: |
          docker build \
            --tag ${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }} \
            .


      - name: Push backend Docker image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }}


      - name: Configure kubectl for EKS
        env:
          EKS_ENDPOINT: ${{ secrets.EKS_ENDPOINT }}
          EKS_CA: ${{ secrets.EKS_CA }}
        run: |
          mkdir -p ~/.kube

          cat > ~/.kube/config <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - name: cluster
              cluster:
                server: ${EKS_ENDPOINT}
                certificate-authority-data: ${EKS_CA}
          contexts:
            - name: cluster
              context:
                cluster: cluster
                user: github-action-user
          current-context: cluster
          users:
            - name: github-action-user
              user:
                exec:
                  apiVersion: client.authentication.k8s.io/v1beta1
                  command: aws
                  args:
                    - eks
                    - get-token
                    - --cluster-name
                    - cluster
                    - --region
                    - us-east-1
          EOF


      - name: Set backend image
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image backend=${{ steps.login-ecr.outputs.registry }}/backend:${{ github.sha }}


      - name: Deploy to Kubernetes
        working-directory: starter/backend/k8s
        run: |
          kubectl apply -k .


      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s
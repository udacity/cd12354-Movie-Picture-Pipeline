name: Backend Continuous Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'

jobs:

  backend-lint:
    name: Backend Code Quality Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install project dependencies
        run: pipenv install --dev

      - name: Execute lint checks
        run: pipenv run lint


  backend-test:
    name: Backend Automated Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install project dependencies
        run: pipenv install --dev

      - name: Execute test suite
        run: pipenv run test


  deploy-backend:
    name: Build and Deploy Backend Application
    needs:
      - backend-lint
      - backend-test

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1


      - name: Authenticate Docker with Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2


      - name: Build and publish backend image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_NAME: backend
          IMAGE_TAG: ${{ github.sha }}

        run: |
          docker build -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG


      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --name cluster \
            --region us-east-1


      - name: Deploy backend to Kubernetes
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_NAME: backend
          IMAGE_TAG: ${{ github.sha }}

        working-directory: starter/backend/k8s

        run: |
          kustomize edit set image backend=$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          kustomize build | kubectl apply -f -
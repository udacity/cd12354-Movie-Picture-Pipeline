name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-cd.yaml"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pipenv"
          cache-dependency-path: "starter/backend/Pipfile.lock"

      - name: Install pipenv and dependencies
        run: |
          pip install --upgrade pip pipenv
          CFLAGS="-std=gnu17" pipenv install --dev

      - name: Run linter
        run: pipenv run lint

      - name: Run unit tests
        run: pipenv run test

  build-and-deploy:
    runs-on: ubuntu-latest
    needs:
      - lint-and-test
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend Docker image
        working-directory: starter/backend
        run: |
          IMAGE_URI="${{ secrets.ECR_BACKEND_REPO }}:${IMAGE_TAG}"
          docker build --tag="${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name "${{ secrets.EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}"

      - name: Deploy Kubernetes manifests with Kustomize
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image backend="${{ secrets.ECR_BACKEND_REPO }}:${IMAGE_TAG}"
          kustomize build | kubectl apply -f -
          git checkout -- .

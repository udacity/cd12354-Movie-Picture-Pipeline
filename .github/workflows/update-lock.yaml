name: Update Backend Lock

on:
  push:
    branches:
      - backend-ci-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Update lock file
        working-directory: starter/backend
        run: pipenv lock

      - name: Show uWSGI version
        working-directory: starter/backend
        run: grep -A5 '"uwsgi"' Pipfile.lock

      - name: Commit updated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add starter/backend/Pipfile.lock

          if git diff --cached --quiet; then
            echo "No lock file changes."
          else
            git commit -m "Update backend dependency lock"
            git push
          fi
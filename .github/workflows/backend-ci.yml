name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install backend dependencies
        run: pipenv install --dev

      - name: Run backend lint
        run: pipenv run lint

  test:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: python -m pip install --upgrade pip pipenv

      - name: Install backend dependencies
        run: pipenv install --dev

      - name: Run backend tests
        run: pipenv run test

  build:
    name: Backend build
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build --tag backend:${{ github.sha }} .

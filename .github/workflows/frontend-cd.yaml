name: Frontend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

env:
  CLUSTER_NAME: cluster

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: starter/frontend/package-lock.json
      - run: npm ci
      - run: CI=true npm test

  build-and-deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region ${{ secrets.AWS_REGION }}

      - name: Get backend API endpoint
        run: |
          for i in $(seq 1 30); do
            HOST=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$HOST" ]; then break; fi
            echo "Waiting for backend LoadBalancer hostname... ($i/30)"
            sleep 10
          done
          if [ -z "$HOST" ]; then
            echo "ERROR: backend service has no LoadBalancer hostname. Deploy the backend first."
            exit 1
          fi
          echo "Backend endpoint: http://$HOST"
          echo "MOVIE_API_URL=http://$HOST" >> $GITHUB_ENV

      - name: Resolve image URI
        run: |
          REPO="$(echo "${{ secrets.FRONTEND_ECR_REPO }}" | tr -d '[:space:]')"
          echo "IMAGE=${REPO}:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build, tag, and push image to ECR
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$MOVIE_API_URL" \
            --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Deploy to EKS
        run: |
          cd k8s
          kustomize edit set image frontend="$IMAGE"
          kustomize build | kubectl apply -f -
          kubectl rollout status deployment/frontend --timeout=180s

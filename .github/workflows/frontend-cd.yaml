name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

env:
  NODE_VERSION_FILE: starter/frontend/.nvmrc
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontend
  EKS_CLUSTER: cluster

defaults:
  run:
    working-directory: starter/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          CI: true

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl for the EKS cluster
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      # The frontend calls the backend from the browser, so the image must be built
      # with the backend's public URL. Look it up from the backend LoadBalancer service.
      - name: Get the backend service URL
        run: |
          BACKEND_HOST=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          if [ -n "$BACKEND_HOST" ]; then
            echo "REACT_APP_MOVIE_API_URL=http://$BACKEND_HOST" >> $GITHUB_ENV
            echo "Using backend URL: http://$BACKEND_HOST"
          else
            echo "::warning::Backend service not found. Deploy the backend first, then re-run this workflow. Building with http://localhost:5000 for now."
            echo "REACT_APP_MOVIE_API_URL=http://localhost:5000" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image tagged with the git SHA
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL=$REACT_APP_MOVIE_API_URL \
            --tag $REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            .
          docker push $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Logging in again gives this job the registry address; job outputs that
      # contain the AWS account ID are masked and dropped by GitHub Actions.
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure kubectl for the EKS cluster
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Ensure kustomize is installed
        run: |
          if ! command -v kustomize >/dev/null; then
            curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
            sudo mv kustomize /usr/local/bin/
          fi
          kustomize version

      - name: Deploy the new image to Kubernetes
        working-directory: starter/frontend/k8s
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kustomize edit set image frontend=$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          kustomize build | kubectl apply -f -

      - name: Wait for the rollout to finish
        run: kubectl rollout status deployment/frontend --timeout=180s

      - name: Show the frontend service address
        run: kubectl get svc frontend

name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: frontend-npm-${{ runner.os }}-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            frontend-npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: frontend-npm-${{ runner.os }}-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            frontend-npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test

  build-and-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl for EKS
        env:
          EKS_ENDPOINT: ${{ secrets.EKS_ENDPOINT }}
          EKS_CA: ${{ secrets.EKS_CA }}
        run: |
          mkdir -p ~/.kube

          cat > ~/.kube/config <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - name: cluster
              cluster:
                server: ${EKS_ENDPOINT}
                certificate-authority-data: ${EKS_CA}
          contexts:
            - name: cluster
              context:
                cluster: cluster
                user: github-action-user
          current-context: cluster
          users:
            - name: github-action-user
              user:
                exec:
                  apiVersion: client.authentication.k8s.io/v1beta1
                  command: aws
                  args:
                    - eks
                    - get-token
                    - --cluster-name
                    - cluster
                    - --region
                    - us-east-1
          EOF

      - name: Build frontend Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL= \
            --tag mp-frontend:latest \
            .

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag frontend image
        run: |
          docker tag \
            mp-frontend:latest \
            509097766587.dkr.ecr.us-east-1.amazonaws.com/frontend:latest

      - name: Push frontend image to ECR
        run: |
          docker push \
            509097766587.dkr.ecr.us-east-1.amazonaws.com/frontend:latest

      - name: Set frontend image
        working-directory: starter/frontend/k8s
        run: |
          kustomize edit set image \
            frontend=509097766587.dkr.ecr.us-east-1.amazonaws.com/frontend:latest

      - name: Deploy to Kubernetes
        working-directory: starter/frontend/k8s
        run: |
          kubectl apply -k .

      - name: Restart frontend deployment
        run: |
          kubectl rollout restart deployment/frontend

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=180s

      - name: Get frontend service
        run: |
          kubectl get service frontend